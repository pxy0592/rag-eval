[project]
name = "rag-eval"
version = "0.1.0"
description = "An evaluation tool to measure the retrieve and generation quality for RAG system."
readme = "README.md"
authors = [{ name = "marc", email = "pxy0592@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "gradio==6.24.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "vllm==0.27.1",
    "wikipedia-api==0.15.0",
    "flagembedding==1.4.0",
    "langchain==1.3.15",
    "ragas==0.4.3"
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0"
]

[project.scripts]
main = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/lib",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["E501"]  # Enforce line length rule
